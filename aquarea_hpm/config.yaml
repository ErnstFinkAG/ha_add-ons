name: Aquarea HPM Bridge
version: "0.5.2"
slug: aquarea_hpm
description: Sensors and controls for the Panasonic Aquarea Heat Pump Manager (PAW-HPM) via MQTT discovery
url: https://github.com/ErnstFinkAG/ha_add-ons/tree/main/aquarea_hpm
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:heat-pump
startup: application
boot: auto
services:
  - mqtt:want
map:
  - share:rw
options:
  host: ""
  username: ""
  password: ""
  access_code: ""
  device_name: Aquarea HPM
  scan_interval: 60
  parameter_interval: 900
  rescan_hours: 24
  max_pages: 150
  enable_control: true
  include_menus: true
  menu_values: useful
  menu_settings: true
  extra_pages: []
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  dump_html: false
  log_level: info
schema:
  host: str?
  username: str?
  password: password?
  access_code: password?
  device_name: str
  scan_interval: int(10,3600)
  parameter_interval: int(60,86400)
  rescan_hours: int(1,168)
  max_pages: int(1,1000)
  max_menu_pages: int(1,5000)?
  enable_control: bool
  include_menus: bool
  menu_values: list(useful|all|none)
  menu_settings: bool
  menu_control: bool?
  extra_pages:
    - str
  dump_html: bool
  request_delay: float(0,5)?
  topic_prefix: str?
  discovery_prefix: str?
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)
