configuration:
  host:
    name: HPM address
    description: IP address or host name of the Heat Pump Manager web interface.
  username:
    name: Username
    description: Only if the HPM login asks for a user name; leave empty otherwise.
  password:
    name: Password
    description: Password (code) of the HPM web login.
  access_code:
    name: Access code
    description: Code for deeper menus that ask for one after login (e.g. the service level). Leave empty to skip those menus.
  device_name:
    name: Device name
    description: Name of the device in Home Assistant; also used in entity ids and MQTT topics.
  scan_interval:
    name: Poll interval (s)
    description: How often the overview pages (temperatures, states) are read.
  parameter_interval:
    name: Parameter poll interval (s)
    description: How often the menu pages with settings are read. They rarely change, so this is slower.
  rescan_hours:
    name: Rescan interval (h)
    description: How often the whole web interface is scanned again for new values.
  max_pages:
    name: Maximum pages
    description: Upper limit of overview pages visited during a scan.
  max_menu_pages:
    name: Maximum menu pages
    description: Upper limit of WEB-FB menu pages visited during a scan (default 500).
  enable_control:
    name: Enable control
    description: Create number/select entities for changeable values. Turn off for read-only sensors.
  include_menus:
    name: Read WEB-FB menus
    description: Also read the parameters in the HPM's WEB-FB menu tree. Access code menus are never read.
  menu_values:
    name: Menu values
    description: "useful = only current values, status and the recommended settings (default); all = every menu value (several hundred, mostly installer settings, read-only); none = no menu values."
  menu_settings:
    name: Change recommended settings
    description: Let Home Assistant change the recommended menu settings (room setpoints, heating curve, summer switch-off, flow limits, buffer, week programmes, clock). Installer settings always stay read-only.
  menu_control:
    name: (old option, no longer used)
    description: Replaced by "Change recommended settings".
  extra_pages:
    name: Extra pages
    description: Additional page names to read, e.g. "v100100.rsp" or "menue.rsp?branchnr=2&level=3".
  mqtt_host:
    name: MQTT broker
    description: Host name or IP of the MQTT broker. Leave empty to use the Mosquitto broker add-on automatically.
  mqtt_port:
    name: MQTT port
    description: Port of the MQTT broker (usually 1883). Only used together with "MQTT broker".
  mqtt_username:
    name: MQTT username
    description: User for the MQTT broker. Leave empty to use the Mosquitto add-on's own credentials.
  mqtt_password:
    name: MQTT password
    description: Password for the MQTT broker.
  dump_html:
    name: Save raw pages
    description: Saves every page and editor the add-on reads to /share/aquarea_hpm for troubleshooting.
  log_level:
    name: Log level
