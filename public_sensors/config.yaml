name: "Public Sensors"
version: "0.2.0"
slug: "public_sensors"
description: >-
  Publish independently configured, read-only Home Assistant history graphs
  without exposing the Home Assistant frontend or credentials to the browser.
url: "https://github.com/ErnstFinkAG/ha_add-ons/tree/main/public_sensors"
startup: services
boot: auto
init: false
homeassistant_api: true
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base:3.21"
  amd64: "ghcr.io/home-assistant/amd64-base:3.21"
  armhf: "ghcr.io/home-assistant/armhf-base:3.21"
  armv7: "ghcr.io/home-assistant/armv7-base:3.21"
  i386: "ghcr.io/home-assistant/i386-base:3.21"
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: "Read-only Public Sensors web interface"
webui: "http://[HOST]:[PORT:8098]/"
options:
  browser_refresh_seconds: 60
  ha_refresh_seconds: 300
  timezone: "Europe/Zurich"
  graphs:
    - id: "groundwater"
      title: "Grundwasserstand und Pump Verlauf"
      sensor_entity: "sensor.efimmo_bw_b1_f0_r0_sen0_groundwaterlevel"
      sensor_name: "Wasserstand"
      sensor_unit: "mm"
      decimals: 1
      sensor_min: 500
      sensor_max: 1000
      binary_entity: "switch.pumpe_1"
      binary_name: "Pumpe"
      history_hours: 48
      group_minutes: 5
      threshold_enabled: true
      threshold_value: 660
      threshold_label: "Trigger 660 mm"
schema:
  browser_refresh_seconds: int
  ha_refresh_seconds: int
  timezone: str
  graphs:
    - id: str
      title: str
      sensor_entity: str
      sensor_name: str
      sensor_unit: "str?"
      decimals: int
      sensor_min: float
      sensor_max: float
      binary_entity: "str?"
      binary_name: str
      history_hours: int
      group_minutes: int
      threshold_enabled: bool
      threshold_value: float
      threshold_label: str

  # v0.1.x compatibility. Existing installations can update without losing
  # their current single-graph configuration. New installations use graphs.
  title: "str?"
  sensor_entity: "str?"
  sensor_name: "str?"
  sensor_unit: "str?"
  sensor_min: "float?"
  sensor_max: "float?"
  binary_entity: "str?"
  binary_name: "str?"
  history_hours: "int?"
  group_minutes: "int?"
  threshold_value: "float?"
  threshold_label: "str?"
