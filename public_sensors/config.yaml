name: "Public Sensors"
version: "0.4.0"
slug: "public_sensors"
description: >-
  Publish independently configured, read-only Home Assistant sensor pages
  through a credential-isolated public web process.
url: "https://github.com/ErnstFinkAG/ha_add-ons/tree/main/public_sensors"
startup: services
boot: auto
init: false
homeassistant_api: true
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base:3.21"
  amd64: "ghcr.io/home-assistant/amd64-base:3.21"
  armhf: "ghcr.io/home-assistant/armhf-base:3.21"
  armv7: "ghcr.io/home-assistant/armv7-base:3.21"
  i386: "ghcr.io/home-assistant/i386-base:3.21"
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: "Read-only Public Sensors web interface"
webui: "http://[HOST]:[PORT:8098]/"
options:
  browser_refresh_seconds: 60
  ha_refresh_seconds: 300
  timezone: "Europe/Zurich"
  show_index: true
  pages:
    - path: "groundwater"
      name: "Grundwasserstand und Pump Verlauf"
      entity_id: ""
      yaml: |
        type: custom:apexcharts-card
        header:
          show: true
          title: Grundwasserstand und Pump Verlauf
        graph_span: 48h
        now:
          show: true
        yaxis:
          - id: level
            min: 500
            max: 1000
            decimals: 0
            apex_config:
              title:
                text: Wasserstand (mm)
          - id: pump
            min: 0
            max: 1.2
            opposite: true
            decimals: 0
            apex_config:
              title:
                text: Pumpe
        apex_config:
          annotations:
            yaxis:
              - y: 660
                yAxisIndex: 0
                label:
                  text: Trigger 660 mm
        series:
          - entity: sensor.efimmo_bw_b1_f0_r0_sen0_groundwaterlevel
            name: Wasserstand
            yaxis_id: level
            type: line
            stroke_width: 1
            group_by:
              duration: 5min
              func: avg
          - entity: switch.pumpe_1
            name: Pumpe
            yaxis_id: pump
            type: line
            curve: stepline
            stroke_width: 1
schema:
  browser_refresh_seconds: int
  ha_refresh_seconds: int
  timezone: str
  show_index: bool
  pages:
    - path: str
      name: str
      yaml: "str?"
      entity_id: "str?"
