configuration:
  browser_refresh_seconds:
    name: Browser refresh
    description: Seconds between browser requests for the public cached data.
  ha_refresh_seconds:
    name: Home Assistant refresh
    description: Seconds between private collector refreshes from Home Assistant.
  timezone:
    name: Timezone
    description: IANA timezone used for public page labels, for example Europe/Zurich.
  show_index:
    name: Show index page
    description: Show a list of all configured public pages at the root URL.
  pages:
    name: Public pages
    description: Universal public pages. Each page uses either full YAML or one entity ID.
    fields:
      path:
        name: URL / path
        description: Lowercase public path below the domain, for example groundwater.
      name:
        name: Name
        description: Public display name used on the page and index.
      yaml:
        name: Full YAML
        description: Full Home Assistant card-style YAML. Leave empty when entity ID mode is used.
      entity_id:
        name: Entity ID
        description: Copy one Home Assistant entity state and its attributes to the public page. Leave empty when YAML mode is used.
network:
  8098/tcp: Credential-free read-only Public Sensors web interface
