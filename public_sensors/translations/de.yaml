configuration:
  browser_refresh_seconds:
    name: Browser-Aktualisierung
    description: Sekunden zwischen Browser-Abfragen der öffentlichen Cache-Daten.
  ha_refresh_seconds:
    name: Home-Assistant-Aktualisierung
    description: Sekunden zwischen internen Abfragen des privaten Collectors bei Home Assistant.
  timezone:
    name: Zeitzone
    description: IANA-Zeitzone für öffentliche Seiten, zum Beispiel Europe/Zurich.
  show_index:
    name: Indexseite anzeigen
    description: Liste aller konfigurierten öffentlichen Seiten unter der Root-URL anzeigen.
  pages:
    name: Öffentliche Seiten
    description: Universelle öffentliche Seiten. Jede Seite verwendet entweder vollständiges YAML oder eine Entity-ID.
    fields:
      path:
        name: URL / Pfad
        description: Kleingeschriebener öffentlicher Pfad unter der Domain, zum Beispiel groundwater.
      name:
        name: Name
        description: Öffentlicher Anzeigename für Seite und Index.
      yaml:
        name: Vollständiges YAML
        description: Vollständiges Home-Assistant-Card-YAML. Leer lassen, wenn Entity-ID verwendet wird.
      entity_id:
        name: Entity-ID
        description: Zustand und Attribute einer Home-Assistant-Entität auf die öffentliche Seite kopieren. Leer lassen, wenn YAML verwendet wird.
network:
  8098/tcp: Zugangsdatenfreie Nur-Lese-Weboberfläche von Public Sensors
