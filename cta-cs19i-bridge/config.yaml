name: CTA CS19i Bridge
version: "0.2.3"
slug: cta_cs19i_bridge
description: CTA CS19i → MQTT bridge with Home Assistant discovery
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: services
boot: auto
init: false

options:
  hostname: 10.80.23.11
  controller_port: 8214
  controller_password: "999990"
  poll_interval: 30

  discovery_prefix: homeassistant
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""

  state_base_topic: cta_cs19i
  log_pages: true
  log_changes_only: true

  nav_refresh_seconds: 3600
  skip_path_prefixes: "Zugang:"
  include_path_prefixes: ""

  cleanup_discovery: true

  climate: true
  climate_mode_setting: ""
  climate_temperature_setting: ""
  climate_current_temperature: ""
  luxtronik_port: 8889
  debug: false
  writable_path_prefixes: ""

schema:
  hostname: str
  controller_port: int
  controller_password: password
  poll_interval: int

  discovery_prefix: str
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: password?

  state_base_topic: str
  log_pages: bool
  log_changes_only: bool
  nav_refresh_seconds: int
  skip_path_prefixes: str
  include_path_prefixes: str?

  cleanup_discovery: bool

  climate: bool
  climate_mode_setting: str?
  climate_temperature_setting: str?
  climate_current_temperature: str?
  luxtronik_port: int
  debug: bool
  writable_path_prefixes: str?

services:
  - mqtt:need
